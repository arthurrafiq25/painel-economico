name: Atualizar Blog (Rápido)

on:
  workflow_dispatch:

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar requests
        run: pip install requests

      - name: Rodar Blogger
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BLOGGER_BLOG_ID: ${{ vars.BLOGGER_BLOG_ID }}
        run: python scripts/etl_blogger.py

      - name: Commit e Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/artigos_historicos.json
          git diff --quiet && git diff --staged --quiet || git commit -m "atualiza blog"
          git push

      - name: Avisar Vercel
        run: curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}