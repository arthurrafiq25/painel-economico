name: Atualizar dados mensalmente

on:
  schedule:
    - cron: "0 3 1 * *"   # dia 1 de cada mês, 03:00 UTC
  workflow_dispatch:        # permite rodar manualmente

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install pandas openpyxl requests beautifulsoup4 py7zr

      - name: Testar conexão IBGE
        run: |
          curl -sS --max-time 30 "https://apisidra.ibge.gov.br/values/t/5938/n3/all/v/37/p/2021" | head -c 200
          
      - name: Rodar scripts
        working-directory: ./scripts 
        run: |
          python baixar_pib.py
          python baixar_populacao.py
          python baixar_pib_per_capita.py
          python gerar_estados_info.py
          python baixar_agropecuaria.py
          python baixar_industria.py
          python baixar_servicos.py
          python baixar_administracao.py
          python baixar_impostos.py
          python baixar_regiao.py
          python baixar_selic.py
          python baixar_ipca.py
          python baixar_cambio.py
          python baixar_desemprego.py
          python baixar_noticias.py
          python baixar_ocupacao.py
          python baixar_salario_minimo.py
          python baixar_ipca_alimentacao.py
          python etl_anp.py
          python baixar_caged.py
          python baixar_tesouro.py

      - name: Diagnóstico Blogger
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          BLOGGER_BLOG_ID: ${{ vars.BLOGGER_BLOG_ID }}
        run: |
          python -c "import os, requests; k=os.environ.get('GOOGLE_API_KEY'); b=os.environ.get('BLOGGER_BLOG_ID'); r=requests.get(f'https://www.googleapis.com/blogger/v3/blogs/{b}/posts?key={k}&maxResults=500'); print('Status:', r.status_code); print('Total posts:', len(r.json().get('items', []))); [print(p['title'], p.get('labels', [])) for p in r.json().get('items', [])]"

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/
          git diff --quiet && git diff --staged --quiet || git commit -m "atualização automática de dados"
          git push

      - name: Avisar Vercel para atualizar o site
        run: |
          curl -X POST ${{ secrets.VERCEL_DEPLOY_HOOK }}